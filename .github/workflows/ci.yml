name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_LISTINGS_API_URL: /api
      MOCK_API_DELAY_MS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Production build and browser smoke tests
        run: npm run test:e2e
      - name: Development prerender and browser regression tests
        run: npm run test:e2e:dev
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
